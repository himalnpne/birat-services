<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Birat Services - Customs Clearance</title>
  <script>
    // Get the current path
    var path = window.location.pathname;
    var search = window.location.search;
    var hash = window.location.hash;
    
    // Redirect to index.html with the path as a parameter
    // This avoids the infinite loop
    if (!path.includes('index.html')) {
      var newUrl = '/index.html?path=' + encodeURIComponent(path + search) + hash;
      window.location.replace(newUrl);
    }
  </script>
</head>
<body>
  <p>Redirecting to the page...</p>
</body>
</html>
