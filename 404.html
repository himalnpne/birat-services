<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <title>Page Not Found | Birat Neupane</title>
    
    <meta name="robots" content="noindex, follow" />
    <link rel="canonical" href="https://biratneupane581.com.np/" />
    
    <!-- Redirect to homepage after 3 seconds -->
    <meta http-equiv="refresh" content="3;url=/" />
    
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        background: #0b0b0b;
        color: #eae8e2;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 20px;
      }
      
      .container {
        max-width: 500px;
      }
      
      h1 {
        font-size: 3rem;
        font-weight: 800;
        margin-bottom: 0.5rem;
        background: linear-gradient(135deg, #8b1a1a, #b32424);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }
      
      p {
        font-size: 1.1rem;
        opacity: 0.7;
        margin-bottom: 1.5rem;
      }
      
      a {
        display: inline-block;
        color: #8b1a1a;
        text-decoration: none;
        font-weight: 600;
        padding: 0.7rem 1.8rem;
        border: 1px solid rgba(139, 26, 26, 0.3);
        border-radius: 12px;
        transition: all 0.3s ease;
      }
      
      a:hover {
        background: #8b1a1a;
        color: #fff;
      }
      
      .redirect-note {
        margin-top: 1.5rem;
        font-size: 0.85rem;
        opacity: 0.4;
      }
    </style>
  </head>
  
  <body>
    <div class="container">
      <h1>404</h1>
      <p>Page not found</p>
      <a href="/">← Back to Home</a>
      <p class="redirect-note">Redirecting you in 3 seconds...</p>
    </div>
  </body>
</html>
