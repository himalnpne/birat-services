<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Birat Services - Customs Clearance</title>
  <script>
    // Redirect all 404s to index.html for SPA routing
    (function() {
      var path = window.location.pathname;
      var search = window.location.search;
      var hash = window.location.hash;
      
      // If the path is not the root and not a file with extension
      if (path !== '/' && !path.match(/\.[a-zA-Z0-9]+$/)) {
        // Redirect to index.html with the path as a query parameter
        var redirectUrl = '/index.html?path=' + encodeURIComponent(path + search);
        window.location.replace(redirectUrl);
      }
    })();
  </script>
</head>
<body>
  <p>Redirecting to the page...</p>
</body>
</html>
